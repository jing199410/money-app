<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8a6a1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="輕帳" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <title>輕帳</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">MONEY DIARY</p>
        <h1 class="brand-title">輕帳</h1>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="切換深色模式">☾</button>
    </header>

    <section class="balance-card soft-card">
      <div class="card-row">
        <div>
          <p class="muted">本月結餘</p>
          <h2 id="monthBalance">NT$ 0</h2>
        </div>
        <span class="month-pill" id="monthLabel">本月</span>
      </div>
      <div class="summary-grid">
        <div class="summary-box income-box">
          <span>收入</span>
          <strong id="monthIncome">NT$ 0</strong>
        </div>
        <div class="summary-box expense-box">
          <span>支出</span>
          <strong id="monthExpense">NT$ 0</strong>
        </div>
      </div>
    </section>

    <section class="quick-card soft-card page page-home active" id="pageHome">
      <div class="section-head">
        <h2>快速記一筆</h2>
        <input type="date" id="recordDate" class="date-input" />
      </div>

      <div class="segmented">
        <button id="expenseTab" class="active" data-type="expense">支出</button>
        <button id="incomeTab" data-type="income">收入</button>
      </div>

      <label class="field-label" for="amountInput">金額</label>
      <div class="amount-field">
        <span>NT$</span>
        <input id="amountInput" type="number" inputmode="decimal" placeholder="0" min="0" />
      </div>

      <div class="category-head">
        <span class="field-label">分類</span>
        <button class="text-btn" id="openCategoryPanel">管理分類</button>
      </div>
      <div class="category-scroll" id="categoryList"></div>

      <label class="field-label" for="noteInput">備註</label>
      <input class="note-input" id="noteInput" placeholder="例如：午餐、車資、薪水" />

      <button class="primary-btn" id="saveBtn">記下來</button>
      <p class="toast" id="toast">已記錄</p>
    </section>

    <section class="records-card soft-card page page-home active" id="recordsBlock">
      <div class="section-head compact">
        <h2>最近紀錄</h2>
        <button class="text-btn" id="clearAllBtn">清空</button>
      </div>
      <div class="record-list" id="recordList"></div>
    </section>

    <section class="soft-card page" id="pageStats">
      <div class="section-head">
        <h2>統計</h2>
        <span class="month-pill" id="statsMonthLabel">本月</span>
      </div>
      <div class="budget-card">
        <div class="budget-top">
          <div>
            <p class="muted">本月預算</p>
            <strong id="budgetAmountText">NT$ 0</strong>
          </div>
          <button class="text-btn" id="editBudgetBtn">設定</button>
        </div>
        <div class="progress-track"><div id="budgetProgress" class="progress-bar"></div></div>
        <p class="budget-note" id="budgetNote">尚未設定預算</p>
      </div>
      <h3 class="sub-title">支出分類圖表</h3>
      <div class="chart-list" id="chartList"></div>
    </section>

    <section class="soft-card page" id="pageSettings">
      <h2>設定</h2>
      <div class="setting-row">
        <div>
          <strong>分類管理</strong>
          <p>自訂收入與支出分類，不使用 emoji。</p>
        </div>
        <button class="small-btn" id="openCategoryPanel2">管理</button>
      </div>
      <div class="setting-row">
        <div>
          <strong>資料匯出</strong>
          <p>下載 CSV 備份你的記帳資料。</p>
        </div>
        <button class="small-btn" id="exportBtn">匯出</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="active" data-page="home">首頁</button>
    <button data-page="stats">統計</button>
    <button data-page="settings">設定</button>
  </nav>

  <div class="sheet-mask" id="sheetMask"></div>
  <section class="bottom-sheet" id="categoryPanel" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="section-head compact">
      <h2>自訂分類</h2>
      <button class="text-btn" id="closeCategoryPanel">關閉</button>
    </div>
    <div class="segmented mini">
      <button class="active" id="manageExpenseBtn" data-manage="expense">支出</button>
      <button id="manageIncomeBtn" data-manage="income">收入</button>
    </div>
    <div class="add-category">
      <input id="newCategoryInput" placeholder="新增分類名稱" />
      <button id="addCategoryBtn">新增</button>
    </div>
    <div class="manage-list" id="manageCategoryList"></div>
  </section>

  <div class="modal-mask" id="budgetModal">
    <div class="modal-card">
      <h2>設定每月預算</h2>
      <p class="muted">此預算用來追蹤每月支出，不會限制記帳。</p>
      <input id="budgetInput" class="note-input" type="number" inputmode="decimal" placeholder="例如：12000" />
      <div class="modal-actions">
        <button class="ghost-btn" id="cancelBudgetBtn">取消</button>
        <button class="primary-btn inline" id="saveBudgetBtn">儲存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
