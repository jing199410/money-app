<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="輕帳" />
  <meta name="theme-color" content="#ead2cf" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <title>輕帳 Money Diary</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MONEY DIARY</p>
        <h1>輕帳</h1>
      </div>
      <button id="themeToggle" class="icon-btn" aria-label="切換深色模式">☾</button>
    </header>

    <main>
      <section id="homePage" class="page active">
        <section class="summary-card glass-card">
          <div class="summary-head">
            <span>本月結餘</span>
            <span id="monthPill" class="month-pill">2026年4月</span>
          </div>
          <div id="balanceAmount" class="balance">NT$ 0</div>
          <div class="mini-grid">
            <div class="mini-card income">
              <span>收入</span>
              <strong id="incomeAmount">NT$ 0</strong>
            </div>
            <div class="mini-card expense">
              <span>支出</span>
              <strong id="expenseAmount">NT$ 0</strong>
            </div>
          </div>
        </section>

        <section class="quick-card glass-card">
          <div class="section-title-row">
            <h2>快速記一筆</h2>
            <span id="todayLabel"></span>
          </div>

          <div class="segmented">
            <button id="expenseTab" class="seg-btn active" data-type="expense">支出</button>
            <button id="incomeTab" class="seg-btn" data-type="income">收入</button>
          </div>

          <label class="field-label" for="amountInput">金額</label>
          <div class="amount-box">
            <input id="amountInput" type="number" inputmode="decimal" placeholder="0" min="0" />
          </div>

          <label class="field-label">分類</label>
          <div id="categoryChips" class="chips"></div>

          <label class="field-label" for="noteInput">備註</label>
          <input id="noteInput" class="text-input" type="text" placeholder="例如：早餐、捷運、薪水" maxlength="40" />

          <button id="saveBtn" class="primary-btn">儲存這一筆</button>
        </section>

        <section class="list-card glass-card">
          <div class="section-title-row">
            <h2>最近紀錄</h2>
            <button id="clearAllBtn" class="text-btn danger">清空</button>
          </div>
          <div id="recordList" class="record-list"></div>
        </section>
      </section>

      <section id="statsPage" class="page">
        <section class="glass-card stats-card">
          <h2>本月統計</h2>
          <div id="categoryStats" class="stats-list"></div>
        </section>
      </section>

      <section id="settingsPage" class="page">
        <section class="glass-card settings-card">
          <h2>設定</h2>
          <p class="hint">資料目前存在這支手機／這個瀏覽器。未來可升級 Firebase 雲端同步。</p>
          <button id="exportBtn" class="secondary-btn">匯出 CSV 備份</button>
          <button id="importDemoBtn" class="secondary-btn">加入範例資料</button>
          <button id="resetBtn" class="secondary-btn danger-outline">清除全部資料</button>
        </section>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <button class="nav-btn active" data-page="homePage">首頁</button>
      <button class="nav-btn" data-page="statsPage">統計</button>
      <button class="nav-btn" data-page="settingsPage">設定</button>
    </nav>

    <div id="toast" class="toast">已儲存</div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
